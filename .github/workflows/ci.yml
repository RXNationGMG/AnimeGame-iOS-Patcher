name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Byte-compile
        run: python -m py_compile gipatch.py panel.py pipeline.py rsa_patch.py patch_standalone.py patch_toggle.py

      - name: Smoke tests
        run: python -m unittest discover -s tests -v

      - name: Help output
        run: |
          python rsa_patch.py --help
          python patch_standalone.py --help
          python patch_toggle.py --help
